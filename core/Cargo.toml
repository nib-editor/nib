[package]
name = "nib-core"
description = "Core of the nib editor: buffers, selections, rendering, and the plugin host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["editor", "wasm", "plugins", "tree-sitter"]
categories = ["text-editors"]
include = ["src/**", "wit/**", "LICENSE-*"]

[dependencies]
# Line endings are normalized to LF on load, so only LF counts as a line break.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
regex-cursor = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
wasmtime = "48"
wasmtime-wasi = "48"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streaming-iterator = "0.1"
# Loads grammars as WebAssembly on the same wasmtime as the plugins.
tree-sitter = { version = "0.27", features = ["wasm"] }
# Lists files for plugins the way ripgrep does, honoring .gitignore.
ignore = "0.4"

# Its own main: started with --fake-lsp, the test binary acts as the
# language server the tests talk to.
[[test]]
name = "lsp"
harness = false
