# Run with `nib plugin test target/plugins/picker plugins/picker/tests/picker.toml`
# after `cargo xtask build-plugins`; tui/tests/plugin_test.rs does.
#
# Each test runs in a directory of its own, holding the test's file and
# `files`, so the picker lists only those.

with = ["helix"]

[[test]]
name = "picks a file by a fuzzy name"
file = "notes.md"
files = { "Cargo.toml" = "[package]\n", "src/main.rs" = "fn main() {}\n", "src/lib.rs" = "" }

[[test.step]]
keys = "<space>f"
wait = 5000
expect.screen = ["files> ", "src/main.rs"]

[[test.step]]
keys = "smain"
expect.screen = ["files> smain", "│ src/main.rs", "│ fn main() {}"]

[[test.step]]
keys = "<ret>"
expect.text = "fn main() {}\n"

[[test]]
name = "escape closes it and gives the keys back"
file = "notes.md"
files = { "a.txt" = "" }

[[test.step]]
keys = "<space>f"
wait = 5000
expect.screen = ["files> ", "a.txt"]

[[test.step]]
keys = "<esc>ihello<esc>"
expect.text = "hello"

[[test]]
name = "the command palette runs a command chosen by its name"
file = "notes.md"

[[test.step]]
keys = "<space>?"
expect.screen = ["commands> ", "│ buffer.save"]

# The one chosen, and all of what it does, beside the list.
[[test.step]]
keys = "bufsave"
expect.screen = ["commands> bufsave", "Save the current buffer, or as"]

[[test.step]]
keys = "<backspace><backspace><backspace><backspace><backspace><backspace><backspace>coremenu<ret>"
expect.screen = ["╭─ nib ─", "Restart all plugins"]

[[test]]
name = "the palette opens the other picker, and finds commands by what they do"
file = "notes.md"
files = { "a.txt" = "" }

[[test.step]]
keys = "<space>?"
expect.screen = ["commands> "]

[[test.step]]
keys = "pick a file"
expect.screen = ["picker.files"]

[[test.step]]
keys = "<ret>"
wait = 5000
expect.screen = ["files> ", "a.txt"]

[[test]]
name = "a directory given picks a file under it"
file = "notes.md"
files = { "a.txt" = "", "sub/deep.txt" = "deep\n", "sub/b.txt" = "" }

[[test.step]]
command = "picker.files"
args = '{"path": "sub"}'
wait = 5000
expect.screen = ["files> ", "deep.txt", "b.txt"]
expect.absent = ["a.txt"]

[[test.step]]
keys = "deep<ret>"
expect.text = "deep\n"
