# Run with `nib plugin test target/plugins/helix plugins/helix/tests/basics.toml`
# after `cargo xtask build-plugins`; tui/tests/plugin_test.rs does.

[[test]]
name = "insert mode puts text before the cursor"
text = "#[w|]#orld\n"
keys = "ihello <esc>"

[test.expect]
selections = "hello #[w|]#orld\n"
screen = ["NOR"]

[[test]]
name = "w selects a word and the space after it"
file = "main.rs"
text = "#[f|]#n main() {}\n"
keys = "w"

[test.expect]
selections = "#[fn |]#main() {}\n"

[[test]]
name = "x extends to lines and d deletes them"
text = "#[o|]#ne\ntwo\nthree\n"
keys = "xxd"

[test.expect]
selections = "#[t|]#hree\n"

[[test]]
name = "u undoes"
text = "#[a|]#bc\n"
keys = "du"

[test.expect]
text = "abc\n"

[[test]]
name = "the core saves"
text = "abc\n"
command = "buffer.save"

[test.expect]
result = "null"

[[test]]
name = ":bc refuses unsaved changes, and :bc! drops them"
text = "abc\n"

[[test.step]]
keys = "ix<esc>:bc<ret>"
# Still open: the message names its path, which is long here.
expect.text = "xabc\n"

[[test.step]]
keys = ":bc!<ret>"
expect.text = ""

[[test]]
name = ": completes a command's name with tab"
text = "abc\n"

[[test.step]]
keys = ":conf"
expect.screen = [":conf", "config-reload  Read the settings again"]

[[test.step]]
keys = "<tab><tab>"
expect.screen = [":config-reload"]

[[test.step]]
keys = "<S-tab>"
expect.screen = [":config"]

[[test]]
name = ": runs any command by its name, with key=value arguments"
text = "abc\n"
files = { "other.txt" = "from the other file\n" }
keys = ":buffer.open path=other.txt<ret>"

[test.expect]
text = "from the other file\n"
selections = "#[f|]#rom the other file\n"

[[test]]
name = ": says so for a name it does not know"
text = "abc\n"
keys = ":nope<ret>"

[test.expect]
screen = ["unknown command: nope"]
