name = "nano"
version = "0.1.0"
description = "A base: GNU nano's keys, with no modes; Ctrl and Alt keys do the rest."
api = "0.7"
# The whole way of editing (docs/design/bases/base.md); only one base runs.
base = true
# Help in nano, the core menu here.
menu-key = "C-g"
# ^R inserts a file from the working directory.
capabilities = ["fs-read"]
