# Run with `nib plugin test target/plugins/files plugins/files/tests/files.toml`
# after `cargo xtask build-plugins`; tui/tests/plugin_test.rs does.
#
# Each test runs in a directory of its own, holding the test's file and
# `files`, so the listings show only those.

with = ["helix"]

[[test]]
name = "Space e lists the file's directory, and Enter goes in and opens"
file = "notes.md"
text = "notes\n"
files = { "src/main.rs" = "fn main() {}\n", "a.txt" = "a\n" }

# Directories first, with the cursor on the file shown before.
[[test.step]]
keys = "<space>e"
expect.screen = ["  ../", "  src/", "  a.txt", "  notes.md"]
expect.absent = ["  main.rs"]

[[test.step]]
keys = "kk<ret>"
expect.screen = ["  ../", "  main.rs"]
expect.absent = ["  a.txt"]

# Up again, with the cursor on the directory left.
[[test.step]]
keys = "-<ret>"
expect.screen = ["  main.rs"]

[[test.step]]
keys = "<ret>"
expect.text = "fn main() {}\n"

[[test]]
name = "q closes the listing"
file = "notes.md"
text = "notes\n"

[[test.step]]
keys = "<space>e"
expect.screen = ["  notes.md"]

[[test.step]]
keys = "q"
expect.text = "notes\n"
expect.absent = ["  ../"]

[[test]]
name = "+ opens a new file, made with its directories when saved"
file = "notes.md"
text = "notes\n"

[[test.step]]
keys = "<space>e+sub/new.txt<ret>"
expect.text = ""
expect.screen = ["sub/new.txt"]

# Saved, it is there, in the directory made for it.
[[test.step]]
keys = "ihi<esc>:w<ret><space>e"
expect.screen = ["sub/", "  new.txt"]

[[test]]
name = "a listing is read-only"
file = "notes.md"
text = "notes\n"

[[test.step]]
keys = "<space>e"
expect.screen = ["  notes.md"]

[[test.step]]
keys = "ix"
expect.screen = ["  notes.md"]
expect.absent = ["x  notes.md"]
