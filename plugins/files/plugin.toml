name = "files"
version = "0.1.0"
description = "Lists a directory in a buffer to open files from, as dired and netrw do."
api = "0.7"
# Lists directories with the core's files.list.
capabilities = ["fs-read"]
# To forget the listings closed from outside it.
events = ["buffer-closed"]

# Under the base's leader: Space e in helix and vim, C-c e in Emacs.
[keys]
e = "files.open"
