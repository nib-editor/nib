name = "test-events"
version = "0.0.0"
api = "0.7"
capabilities = ["process", "fs-read"]
events = [
    "buffer-opened",
    "buffer-saved",
    "buffer-changed",
    "test-events.ping",
    "test-events.loop",
    "mode-changed",
    "buffer-closed",
]

# f loses to picker's when both are loaded, picker first.
[keys]
f = "test-events.echo"
"t l" = "test-events.log"
