# Plugins build only for wasm32-wasip2, so they live in their own workspace.
# Build them with `cargo xtask build-plugins` from the repository root.
[workspace]
resolver = "3"
# Rust plugins only; test/go is built with TinyGo.
members = [
    "base-kit",
    "helix",
    "indent",
    "lsp",
    "nano",
    "picker",
    "test/events",
    "test/insert",
    "test/misbehave",
    "vim",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
nib-plugin = { path = "../sdk/rust" }
