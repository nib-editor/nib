# Data only: a grammar and its queries, no plugin code.
name = "python"
version = "0.1.0"
api = "0.6"

[[languages]]
name = "python"
file-types = ["py", "pyi"]
grammar = "tree-sitter-python.wasm"

[languages.queries]
highlights = "queries/highlights.scm"
textobjects = "queries/textobjects.scm"

# Fetched and checked by `cargo xtask build-plugins`; not in the repository.
[[fetch]]
file = "tree-sitter-python.wasm"
url = "https://github.com/tree-sitter/tree-sitter-python/releases/download/v0.25.0/tree-sitter-python.wasm"
sha256 = "16108b50df4ee9a30168794252ab55e7c93bfc5765d7fa0aa3e335752c515f47"
