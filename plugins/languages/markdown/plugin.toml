# Data only: a grammar and its queries, no plugin code.
name = "markdown"
version = "0.1.4"
api = "0.4"

[[languages]]
name = "markdown"
file-types = ["md", "markdown"]
grammar = "tree-sitter-markdown.wasm"

[languages.queries]
highlights = "queries/highlights.scm"
textobjects = "queries/textobjects.scm"
injections = "queries/injections.scm"

# The inline elements (emphasis, code, links) of each paragraph, heading,
# and table cell, which the Markdown grammar leaves as text. Found only
# through the `injections` query, never by file type.
[[languages]]
name = "markdown_inline"
file-types = []
grammar = "tree-sitter-markdown_inline.wasm"

[languages.queries]
highlights = "queries/inline-highlights.scm"

# Fetched and checked by `cargo xtask build-plugins`; not in the repository.
[[fetch]]
file = "tree-sitter-markdown.wasm"
url = "https://github.com/tree-sitter-grammars/tree-sitter-markdown/releases/download/v0.5.3/tree-sitter-markdown.wasm"
sha256 = "dd9fc12ac2804d7c7da787e4774125b32e4fb3c244e5e7031a77cb7dd8036020"

[[fetch]]
file = "tree-sitter-markdown_inline.wasm"
url = "https://github.com/tree-sitter-grammars/tree-sitter-markdown/releases/download/v0.5.3/tree-sitter-markdown_inline.wasm"
sha256 = "d47e5c43683c39b645ced8720ab90c3b3f467e715d3426b29ef3f69984d88c15"
