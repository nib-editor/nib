# Data only: a grammar and its queries, no plugin code.
name = "bash"
version = "0.1.0"
api = "0.6"

[[languages]]
name = "bash"
file-types = ["sh", "bash"]
grammar = "tree-sitter-bash.wasm"

[languages.queries]
highlights = "queries/highlights.scm"
textobjects = "queries/textobjects.scm"

# Fetched and checked by `cargo xtask build-plugins`; not in the repository.
[[fetch]]
file = "tree-sitter-bash.wasm"
url = "https://github.com/tree-sitter/tree-sitter-bash/releases/download/v0.25.1/tree-sitter-bash.wasm"
sha256 = "8292919c88a0f7d3fb31d0cd0253ca5a9531bc1ede82b0537f2c63dd8abe6a7a"
