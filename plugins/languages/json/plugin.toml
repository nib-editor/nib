# Data only: a grammar and its queries, no plugin code.
name = "json"
version = "0.1.0"
api = "0.6"

[[languages]]
name = "json"
file-types = ["json"]
grammar = "tree-sitter-json.wasm"

[languages.queries]
highlights = "queries/highlights.scm"
textobjects = "queries/textobjects.scm"

# Fetched and checked by `cargo xtask build-plugins`; not in the repository.
[[fetch]]
file = "tree-sitter-json.wasm"
url = "https://github.com/tree-sitter/tree-sitter-json/releases/download/v0.24.8/tree-sitter-json.wasm"
sha256 = "d2119fb98d5912719b13f9458574f8608d2d29dfbe45f6be1f860ea1fe2a2405"
