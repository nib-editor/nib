name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask build-plugins
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path plugins/Cargo.toml
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path plugins/Cargo.toml --workspace --target wasm32-wasip2 --locked -- -D warnings
      # Plugins' own unit tests, such as fuzzy matching, run natively.
      - run: cargo test --manifest-path plugins/Cargo.toml --workspace --locked
      # The Go SDK carries a copy of the WIT, which has to match.
      - run: diff api/wit/plugin.wit sdk/go/wit/deps/nib-plugin/plugin.wit
      # So does the core, whose crate on crates.io cannot read api/.
      - run: diff api/wit/plugin.wit core/wit/plugin.wit
      - run: test -z "$(gofmt -l sdk/go plugins/test/go)"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      # For the Go SDK's test plugin: TinyGo brings binaryen's wasm-opt, and
      # makes components with wasm-tools.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.42.0"
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
      - run: cargo xtask build-plugins
      - run: cargo test --workspace --locked
        env:
          NIB_REQUIRE_GO: "1"

  # The vim and emacs bases against the editors they follow
  # (tui/tests/compare.rs), which the other jobs skip for want of them.
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Install Neovim
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz | tar xz -C "$HOME"
          echo "$HOME/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      # The version the cases were checked against (docs/design/bases/emacs.md); the
      # distribution's may be older.
      - uses: purcell/setup-emacs@master
        with:
          version: "31.1"
      - run: cargo xtask build-plugins
      - run: cargo test -p nib-editor --test compare --locked
        env:
          NIB_REQUIRE_EDITORS: "1"
