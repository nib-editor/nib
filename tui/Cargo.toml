[package]
# nib is taken on crates.io; the binary is still nib.
name = "nib-editor"
description = "A modal editor made of WebAssembly plugins, the Helix-style keymap included"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["editor", "modal", "wasm", "plugins", "tree-sitter"]
categories = ["text-editors", "command-line-utilities"]
# The standard plugins in plugins/ are ignored by git but shipped.
include = [
    "src/**",
    "templates/**",
    "build.rs",
    "standard-plugins.txt",
    "plugins/**",
    "LICENSE-*",
]

[[bin]]
name = "nib"
path = "src/main.rs"

[dependencies]
# The OS clipboard, which nib-core leaves to the frontend.
arboard = "3"
# Plugin archives (.nib.tar.gz) for `nib plugin pack` and `add`.
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
crossterm = "0.29"
nib-core.workspace = true

# `cargo binstall nib-editor` takes the release's archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/nib-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
