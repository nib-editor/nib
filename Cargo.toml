[workspace]
resolver = "3"
members = ["core", "tui", "sdk/rust", "xtask"]
exclude = ["plugins"]

[workspace.package]
version = "0.12.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Q0tzly <contact@q0tzly.dev>"]
repository = "https://github.com/nib-editor/nib"
homepage = "https://github.com/nib-editor/nib"

[workspace.dependencies]
# The same version as the workspace's, which crates.io needs.
nib-editor-core = { path = "core", version = "0.12.2" }

# Debug builds take gigabytes a build, most of it debug info of the
# dependencies, wasmtime above all. Line tables keep panics' locations.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
